<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #0077cc;
            color: white;
            padding: 20px;
            text-align: center; 
        }

        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 18px;
        }

        nav a:hover {
            color: yellow;
        }

        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
        }

        .hero {
            text-align: center;
            margin-top: 20px;
        }

        .hero img {
            width: 100%;
            max-width: 700px;
            border-radius: 10px;
        }

        .about {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>Welcome to My Website</h1>
    <p>Learn HTML, CSS & Web Development</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</nav>

<div class="container">

    <div class="hero">
        <img src="https://via.placeholder.com/700x350" alt="Website Image">
    </div>

    <div class="about">
        <h2>About Us</h2>
        <p>
            This is a simple website created using HTML and CSS.
            You can customize this page by changing the text,
            colors, images, and layout.
        </p>
    </div>

</div>

<footer>
    <p>&copy; 2026 My Website. All Rights Reserved.</p>
</footer>

</body>
</html>
